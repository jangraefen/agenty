# Operator config: what the platform team owns. Run agenty serve from this
# directory, so the MCP server's ./sandbox resolves here.
provider:
  anthropic:
    # Read from the environment (or a .env file); never written here.
    api_key: {env: ANTHROPIC_API_KEY}
    max_tokens: 4096
database:
  # A PostgreSQL URL, such as postgres://agenty:PASSWORD@localhost/agenty.
  url: {env: DATABASE_URL}
mcp_servers:
  # The reference filesystem MCP server, limited to ./sandbox. Needs Node.js.
  files:
    command: npx
    args: [-y, "@modelcontextprotocol/server-filesystem@2026.8.31", ./sandbox]
# Who may use the API. Each user signs in with a bearer token of at least 32
# characters, read from the environment, such as one from: openssl rand -hex 32
users:
  demo:
    token: {env: AGENTY_TOKEN}
# Harnesses and runs live in workspaces; only members see one.
workspaces:
  notes:
    members: [demo]
# A call that needs approval is rejected when no one answers within this.
approvals:
  timeout: 30m
policy:
  files: [policies/central.rego]
