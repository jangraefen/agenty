version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - depguard # import boundaries, below
    - errorlint # wrapped errors are compared with errors.Is/As
    - forbidigo # trust-model rules, below
    - gosec # security-sensitive patterns
    - misspell
    - nolintlint # every //nolint names its linter and says why
    - testifylint # testify usage, e.g. require vs assert
    - unconvert
  settings:
    errcheck:
      # Errors assigned to _ count as unchecked: surface them, or panic if they
      # cannot happen.
      check-blank: true
    depguard:
      rules:
        opa:
          # OPA stays behind internal/policy: one place evaluates Rego.
          files: ["$all", "!**/internal/policy/**"]
          deny:
            - pkg: github.com/open-policy-agent/opa
              desc: evaluate policy only through internal/policy
        mcp:
          # Only internal/mcptool talks to MCP servers; a session elsewhere could
          # call tools around the gateway (trust model guarantee 2).
          files: ["$all", "!**/internal/mcptool/**"]
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: reach MCP servers only through internal/mcptool and the tool gateway
        postgres:
          # internal/store owns the database: queries are generated by sqlc
          # there, and nothing else holds a connection.
          files: ["$all", "!**/internal/store/**"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: reach PostgreSQL only through internal/store
            - pkg: github.com/pressly/goose
              desc: migrations are applied only by internal/store
        anthropic:
          # One place builds Anthropic clients, with the SDK's environment
          # defaults turned off; a client built elsewhere could read credentials
          # and endpoints from the environment.
          files: ["$all", "!**/internal/model/anthropic/**"]
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: reach the Anthropic API only through internal/model/anthropic
    forbidigo:
      analyze-types: true
      forbid:
        # Trust model guarantee 2: every side effect goes through the gateway.
        # Only internal/toolgateway may execute a tool.
        - pattern: ^toolgateway\.Tool\.Call$
          msg: execute tools only through the tool gateway (trust model guarantee 2)
        # The gateway owns tool servers: only it starts them and lists their
        # tools, so no other code holds a tool it could call.
        - pattern: ^(toolgateway\.(ToolServer\.Start|ToolSession\.Tools)|mcptool\.(Server\.Start|Session\.Tools))$
          msg: start tool servers and list their tools only in the tool gateway (trust model guarantee 2)
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests of secret handling need fake credentials; G101 still guards
      # production code.
      - path: _test\.go$
        linters: [gosec]
        text: G101
      - path: internal/toolgateway/[^/]+\.go$
        linters: [forbidigo]
        text: execute tools only through the tool gateway
      - path: internal/toolgateway/[^/]+\.go$
        linters: [forbidigo]
        text: start tool servers and list their tools only in the tool gateway
      # mcptool's own tests exercise its sessions directly.
      - path: internal/mcptool/[^/]+_test\.go$
        linters: [forbidigo]
        text: start tool servers and list their tools only in the tool gateway

issues:
  # Show every finding; the defaults hide repeats and all but one per line.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jangraefen/agenty
