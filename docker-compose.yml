services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agenty}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Development identity provider (OIDC); the issuer is http://localhost:8080/agenty.
  # A username that is an email address (alice@example.com) gets it as email and name, so the
  # login form needs no claims. Other usernames (the tests') keep the claims typed in the form.
  # `$$` escapes compose interpolation: the server sees ${subject}.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "agenty", "requestMappings": [{
        "requestParam": "subject", "match": "[^@]+@[^@]+", "claims": {"email": "$${subject}",
        "name": "$${subject}", "email_verified": true}}]}]}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
