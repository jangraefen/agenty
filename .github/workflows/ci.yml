name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      # IDEA.md: the gateway, policy and secret redaction are where security
      # lives and get full coverage.
      - name: toolgateway, policy and secret coverage is 100%
        run: |
          for pkg in toolgateway policy secret; do
            go test -coverprofile="$pkg.out" "./internal/$pkg/"
            total=$(go tool cover -func="$pkg.out" | awk '/^total:/ {print $3}')
            echo "$pkg coverage: $total"
            [ "$total" = "100.0%" ] || exit 1
          done
