version: 2
updates:
  # Keeps the SHA pins in .github/workflows and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      go:
        patterns: ["*"]

  # Major versions come one pull request each, as they may need changes.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # openapi-typescript generates code with TypeScript 6's JavaScript
      # API (see pnpm-workspace.yaml).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
