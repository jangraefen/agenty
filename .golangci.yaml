version: "2"
run:
  # Lint every test tier, not only untagged files (ARCHITECTURE §15.4).
  build-tags:
    - module
    - integration
    - e2e
    - milestone
linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - depguard
    - dupl
    - errcheck
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - modernize
    - nolintlint
    - prealloc
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usetesting
    - whitespace
  settings:
    # Architecture boundaries (ARCHITECTURE §3, §4, §15.3). Package paths follow §5.1:
    # server packages at server/internal/<package>, executors at server/internal/executor/<kind>.
    depguard:
      rules:
        executors:
          files:
            - $all
            - "!**/server/internal/toolgateway/**"
            - "!**/server/internal/executor/**"
          # Exact package ($) plus subpackages (/); a bare prefix would also match e.g. ".../executorx".
          deny:
            - pkg: github.com/jangraefen/agenty/server/internal/executor$
              desc: "executors are imported only by toolgateway, the single side-effect path (ARCHITECTURE §3 invariant 1)"
            - pkg: github.com/jangraefen/agenty/server/internal/executor/
              desc: "executors are imported only by toolgateway, the single side-effect path (ARCHITECTURE §3 invariant 1)"
        server-module:
          files:
            - "**/server/**"
          deny:
            - pkg: github.com/jangraefen/agenty/sandbox$
              desc: "server and sandbox share only generated contracts from api/ (ARCHITECTURE §4)"
            - pkg: github.com/jangraefen/agenty/sandbox/
              desc: "server and sandbox share only generated contracts from api/ (ARCHITECTURE §4)"
        sandbox-module:
          files:
            - "**/sandbox/**"
          deny:
            - pkg: github.com/jangraefen/agenty/server$
              desc: "server and sandbox share only generated contracts from api/ (ARCHITECTURE §4)"
            - pkg: github.com/jangraefen/agenty/server/
              desc: "server and sandbox share only generated contracts from api/ (ARCHITECTURE §4)"
    govet:
      disable:
        - fieldalignment
      enable-all: true
    goconst:
      min-occurrences: 15
    # Every //nolint names the linter and says why; stale directives fail the lint.
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
    # Structured logging through log/slog (AGENTS.md): key-value pairs or attributes, never mixed.
    sloglint:
      no-mixed-args: true
    # AGENTS.md: require for preconditions, assert for independent checks. The require-error
    # checker would force require for every error assertion, contradicting that rule.
    testifylint:
      enable-all: true
      disable:
        - require-error
    usetesting:
      context-background: true
      context-todo: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true
      os-create-temp: true
      os-chdir: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)" shadows declaration at'
      - linters:
          - funlen
        path: _test\.go$
      # Tests build and run binaries and read fixtures from paths they compute themselves;
      # production code annotates each such call with //nolint:gosec and a reason instead.
      - linters:
          - gosec
        path: _test\.go$
        text: "G(204|302|304):"
formatters:
  enable:
    - gofmt
