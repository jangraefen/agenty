openapi: 3.0.3
info:
  title: Agenty API
  version: v1
  description: |
    The API of an agenty server: it stores harnesses, runs them, and streams
    each run's events, approval requests included.

    Every request signs in with a user's bearer token. Harnesses and runs
    live in workspaces; a workspace the user is not a member of is not found,
    and neither is a run asked for in another workspace than its own.

    Errors are returned as an Error: 400 for an invalid request, 401 without
    a valid token, 403 for a request for a host that is not local or from a
    web page of an origin that is not configured, 404 for anything not
    found, workspaces included, 409 for cancelling a run that has finished,
    for following up a run that has not or that is followed up already, or
    for a run that runs on another server, 415 for a body that is not
    JSON, 500 when the server fails, and 503 while the server is stopping.
    A run that cannot start, such as one whose grants no MCP server serves,
    is queued all the same and fails.

    This file is the API's source of truth: the Go types in internal/api and
    the server interface in internal/server are generated from it.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []

paths:
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user and their workspaces
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations:
    get:
      operationId: listConversations
      summary: The conversations the user started, latest activity first, a page at a time
      description: |
        The conversations whose first run the user started, in the
        workspaces they are a member of, the one whose latest run was
        started last first. Only its starter continues, cancels and answers
        a conversation, through its workspace; in one from before runs were
        private, another member's follow-up belongs to the starter too. A
        conversation followed up while the pages are read moves to the
        first page, so later pages leave it out.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: Continue after the conversation this cursor names, as ConversationList.next gives it.
          schema: {type: string}
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/conversations/{id}:
    get:
      operationId: getConversation
      summary: A conversation the user started, in one of their workspaces
      description: |
        Only the user who started the conversation finds it, and only while
        they are a member of its workspace. Only the ID of its first run
        names it.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the conversation's first run.
          schema: {type: string}
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConversationSummary"}
        default: {$ref: "#/components/responses/Error"}

  /v1/audit/runs:
    get:
      operationId: listAuditRuns
      summary: The runs of every workspace, newest first, a page at a time, for auditors
      description: |
        Only auditors may list them; anyone else is forbidden. A run shows
        what happened, not what was said: neither its input nor its output.
      parameters:
        - name: workspace
          in: query
          description: Only the runs of this workspace.
          schema: {type: string}
        - name: harness
          in: query
          description: Only the runs of harnesses with this name.
          schema: {type: string}
        - name: started_by
          in: query
          description: Only the runs this user started.
          schema: {type: string}
        - name: status
          in: query
          description: Only the runs with this status.
          schema: {$ref: "#/components/schemas/RunStatus"}
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: |
            Continue after the run with this ID, as AuditRunList.next gives
            it. A run that does not exist gives an empty page.
          schema: {type: string}
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditRunList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/audit/runs/{id}:
    get:
      operationId: getAuditRun
      summary: A run of any workspace with its audit records, for auditors
      description: Only auditors may read it; anyone else is forbidden.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The run and its audit records, in the order they were recorded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditRunDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/me/activity:
    get:
      operationId: listMyActivity
      summary: What the user did, newest first, a page at a time
      description: |
        The events whose actor is the user: their runs' calls, their
        approvals, cancels and harness changes, and, for an auditor, their
        reads. Not what others did, auditors' reads of the user's runs
        included.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeEvent"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditLogEventList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: Every event of the audit log, newest first, a page at a time, for auditors
      description: |
        Only auditors may list them; anyone else is forbidden. The listing
        is itself recorded as an auditor's read.
      parameters:
        - name: actor
          in: query
          description: Only the events by this user.
          schema: {type: string}
        - name: workspace
          in: query
          description: Only the events in this workspace.
          schema: {type: string}
        - name: action
          in: query
          description: Only the events with this action.
          schema: {type: string}
        - name: run
          in: query
          description: Only the events about this run.
          schema: {type: string}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeEvent"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditLogEventList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/audit/export:
    get:
      operationId: exportAuditLog
      summary: The audit log as JSON lines, for auditors
      description: |
        Every event after the one named by after, in order, one AuditLogEvent a
        line, with the hashes that chain them; agenty audit verify checks
        such an export. Only auditors may export it; anyone else is
        forbidden. The trailer Audit-Export-Complete is true once the last
        event is written: an export without it was cut short.
      parameters:
        - name: after
          in: query
          description: Start after the event with this id; 0, the default, starts at the first.
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        "200":
          description: The events, one a line.
          content:
            application/jsonl:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/audit:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      operationId: listWorkspaceAuditEvents
      summary: The changes made to a workspace, newest first, a page at a time
      description: |
        The events that change the workspace itself: its harnesses' new
        versions. Its members' runs are theirs, not the workspace's.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/BeforeEvent"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditLogEventList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/harnesses:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      operationId: listHarnesses
      summary: The latest version of every harness, sorted by name
      responses:
        "200":
          description: The harnesses.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/HarnessVersion"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/harnesses/{name}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - name: name
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getHarness
      summary: The latest version of a harness
      responses:
        "200":
          description: The harness version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HarnessVersion"}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: putHarness
      summary: Store a harness as its next version
      description: |
        A changed harness becomes the next version; an unchanged one is left
        as it is, and its latest version is returned. The name must match
        the path.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Harness"}
      responses:
        "200":
          description: The stored version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HarnessVersion"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    post:
      operationId: createRun
      summary: Start a run of a harness's latest version
      description: |
        Queues the run, which starts once a worker is free; its events tell
        when. A run whose MCP servers cannot serve its grants fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRun"}
      responses:
        "201":
          description: The run, queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRun
      summary: A run
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}/follow-up:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: followUpRun
      summary: Continue a run's conversation with a new run
      description: |
        Starts a run of the harness version of the run it follows, not the
        latest, that continues the conversation: the model sees the earlier
        runs' transcripts, with secrets redacted, before the new input. Only the conversation's
        latest run can be followed up, once it has finished; any other is a
        conflict. A run that failed or was cancelled is continued from where
        it stopped: the model is told so, and that a tool call whose result
        was not recorded may or may not have run. No call is run again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FollowUp"}
      responses:
        "201":
          description: The run, queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}/conversation:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRunConversation
      summary: The runs of the conversation a run belongs to, oldest first
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Run"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: cancelRun
      summary: Cancel a queued, waiting or running run
      description: |
        A queued run, or one waiting for approval, ends at once; a running
        one as soon as what it is doing stops. Either ends as cancelled by
        the user; its events tell when.
      responses:
        "202":
          description: The run is being cancelled.
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}/transcript:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getRunTranscript
      summary: A run's conversation with the model, with secrets redacted
      responses:
        "200":
          description: The messages, in order.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TranscriptMessage"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: streamRunEvents
      summary: A run's events, as server-sent events
      description: |
        The events from the run's start. A running run's stream follows it
        until it finishes; a finished run's stream replays its audit records
        and its end. Each event's data is JSON:

        - `audit`: an AuditRecord
        - `approval`: an ApprovalRequest
        - `finished`: the Run, always the last event
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/runs/{id}/approvals/{approval}:
    parameters:
      - $ref: "#/components/parameters/Workspace"
      - $ref: "#/components/parameters/RunID"
      - name: approval
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: answerApproval
      summary: Answer an approval request
      description: |
        The signed-in user is recorded as the approver. The answer queues the
        run, which resumes at the call; a request is answered once, and not
        after it expired, which rejected it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Answer"}
      responses:
        "204":
          description: The answer is accepted.
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}/approvals:
    parameters:
      - $ref: "#/components/parameters/Workspace"
    get:
      operationId: listApprovals
      summary: The approval requests the user's own runs wait for, oldest first
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ApprovalRequest"}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    Workspace:
      name: workspace
      in: path
      required: true
      schema: {type: string}
    RunID:
      name: id
      in: path
      required: true
      description: |
        A run of a conversation the user started. Any other run, also one of
        another member's conversation, is not found.
      schema: {type: string}
    BeforeEvent:
      name: before
      in: query
      description: Continue before the event with this id, as AuditLogEventList.next gives it.
      schema: {type: integer, format: int64, minimum: 1}
    Limit:
      name: limit
      in: query
      description: The page size.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}

  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}

    Me:
      type: object
      required: [user, workspaces, auditor]
      properties:
        user: {type: string}
        workspaces:
          description: The workspaces the user is a member of, sorted.
          type: array
          items: {type: string}
        auditor:
          description: Whether the user may read the audit log of every workspace.
          type: boolean

    Harness:
      description: A declarative definition of an agent.
      type: object
      additionalProperties: false
      required: [name, instructions, model, limits]
      properties:
        name: {type: string}
        instructions: {type: string}
        model: {$ref: "#/components/schemas/HarnessModel"}
        tools:
          description: The granted tools.
          type: array
          items: {type: string}
        limits: {$ref: "#/components/schemas/Limits"}
        policy:
          description: |
            Rego modules in package agenty.tool that tighten central policy
            for this harness.
          type: array
          items: {$ref: "#/components/schemas/PolicyModule"}

    HarnessModel:
      type: object
      additionalProperties: false
      required: [provider, name]
      properties:
        provider: {type: string}
        name: {type: string}

    Limits:
      type: object
      additionalProperties: false
      required: [max_steps, max_tool_calls]
      properties:
        max_steps:
          description: Bounds the model calls of a run.
          type: integer
        max_tool_calls:
          description: Bounds the tool calls of a run, denied ones included.
          type: integer

    PolicyModule:
      type: object
      additionalProperties: false
      required: [name, source]
      properties:
        name: {type: string}
        source: {type: string}

    HarnessVersion:
      type: object
      required: [id, version, harness, created_at]
      properties:
        id:
          description: Identifies the version across all harnesses.
          type: integer
          format: int64
        version: {type: integer}
        harness: {$ref: "#/components/schemas/Harness"}
        created_at: {type: string, format: date-time}

    CreateRun:
      type: object
      additionalProperties: false
      required: [harness, input]
      properties:
        harness:
          description: The harness to run, by name; the run uses its latest version.
          type: string
        input: {type: string}

    FollowUp:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {type: string}

    RunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, cancelled]

    Run:
      type: object
      required: [id, conversation_id, harness_version_id, harness, harness_version, started_by, input, status, output, steps, usage, created_at]
      properties:
        id: {type: string}
        conversation_id:
          description: |
            The conversation the run belongs to, named by the ID of its
            first run, which may be this one.
          type: string
        follows:
          description: The run whose conversation this run continues, if any.
          type: string
        harness_version_id: {type: integer, format: int64}
        harness: {type: string}
        harness_version: {type: integer}
        started_by:
          description: The user who started the run.
          type: string
        input: {type: string}
        status: {$ref: "#/components/schemas/RunStatus"}
        output: {type: string}
        steps: {type: integer}
        usage:
          description: |
            The tokens of the model calls that wrote the run's replies so
            far. A call that failed, such as one whose reply was cut off, is
            not counted.
          allOf: [{$ref: "#/components/schemas/Usage"}]
        error:
          description: Why the run failed, or who cancelled it.
          type: string
        created_at: {type: string, format: date-time}
        finished_at:
          description: Unset until the run has finished.
          type: string
          format: date-time
          x-omitzero: true

    Usage:
      description: |
        The tokens of model calls. Input the provider read from its prompt
        cache, or wrote to it, is counted apart from the rest of the input.
      type: object
      required: [input_tokens, output_tokens, cache_write_tokens, cache_read_tokens]
      properties:
        input_tokens:
          description: Input tokens neither read from nor written to the cache.
          type: integer
          format: int64
        output_tokens: {type: integer, format: int64}
        cache_write_tokens:
          description: Input tokens written to the prompt cache.
          type: integer
          format: int64
        cache_read_tokens:
          description: Input tokens read from the prompt cache.
          type: integer
          format: int64

    AuditRun:
      description: A run as auditors see it, without what was said in it.
      type: object
      required: [id, conversation_id, workspace, harness, harness_version, started_by, status, steps, usage, created_at]
      properties:
        id: {type: string}
        conversation_id: {type: string}
        follows: {type: string}
        workspace: {type: string}
        harness: {type: string}
        harness_version: {type: integer}
        started_by: {type: string}
        status: {$ref: "#/components/schemas/RunStatus"}
        steps: {type: integer}
        usage: {$ref: "#/components/schemas/Usage"}
        error:
          description: Why the run failed, or who cancelled it.
          type: string
        created_at: {type: string, format: date-time}
        finished_at:
          description: Unset until the run has finished.
          type: string
          format: date-time
          x-omitzero: true

    AuditLogEvent:
      description: |
        One event of the audit log, as package auditlog hashes it: hash is
        the SHA-256 of a fixed encoding of the other fields, prev_hash the
        hash of the event before it, zero before the first.
      type: object
      additionalProperties: false
      required: [id, recorded_at, actor, action, workspace, run_id, target, details, prev_hash, hash]
      properties:
        id:
          description: The event's position in the log, from 1 without gaps.
          type: integer
          format: int64
        recorded_at: {type: string, format: date-time}
        actor:
          description: The user who acted; empty for the server itself.
          type: string
        action: {type: string}
        workspace:
          description: Empty for an event of the whole organisation.
          type: string
        run_id: {type: string}
        target: {type: string}
        details: {type: object, additionalProperties: true}
        prev_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        hash: {type: string, pattern: "^[0-9a-f]{64}$"}

    AuditLogEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/AuditLogEvent"}
        next:
          description: The before parameter of the next page; unset on the last.
          type: integer
          format: int64

    AuditRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: {$ref: "#/components/schemas/AuditRun"}
        next:
          description: The before parameter of the next page, which may be empty.
          type: string

    AuditRunDetail:
      type: object
      required: [run, records]
      properties:
        run: {$ref: "#/components/schemas/AuditRun"}
        records:
          type: array
          items: {$ref: "#/components/schemas/AuditRecord"}

    ConversationSummary:
      type: object
      required: [id, workspace, harness, title, status]
      properties:
        id:
          description: The ID of the conversation's first run, which names it.
          type: string
        workspace: {type: string}
        harness: {type: string}
        title:
          description: The first run's input, cut to its first 100 characters.
          type: string
        status:
          description: The status of the conversation's latest run.
          allOf: [{$ref: "#/components/schemas/RunStatus"}]

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: {$ref: "#/components/schemas/ConversationSummary"}
        next:
          description: The before parameter of the next page, which may be empty.
          type: string

    AuditEvent:
      type: string
      enum: [decision, approval, result]

    Decision:
      type: string
      enum: [allow, deny, require_approval]

    AuditRecord:
      description: One decision, approval or result the tool gateway recorded.
      type: object
      required: [run_id, call_id, event, tool, decision, recorded_at]
      properties:
        run_id: {type: string}
        call_id: {type: string}
        event: {$ref: "#/components/schemas/AuditEvent"}
        tool: {type: string}
        args: {$ref: "#/components/schemas/JSON"}
        decision: {$ref: "#/components/schemas/Decision"}
        reason: {type: string}
        approver:
          description: Who approved or rejected the call, if anyone did.
          type: string
        result: {$ref: "#/components/schemas/JSON"}
        error: {type: string}
        recorded_at: {type: string, format: date-time}

    Role:
      type: string
      enum: [user, assistant]

    ToolCall:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        args: {$ref: "#/components/schemas/JSON"}

    ToolResult:
      type: object
      required: [call_id, content]
      properties:
        call_id: {type: string}
        content: {type: string}
        is_error: {type: boolean}

    ProviderPart:
      description: |
        A message in the form of the provider that generated it, kept so it
        can be sent to the model again.
      type: object
      required: [name, data]
      properties:
        name: {type: string}
        data: {$ref: "#/components/schemas/JSON"}

    TranscriptMessage:
      description: |
        One message of a run's conversation with the model: the input, a
        model reply, or the results of the reply's tool calls.
      type: object
      required: [position, role, created_at]
      properties:
        position:
          description: The message's index in the conversation.
          type: integer
        role: {$ref: "#/components/schemas/Role"}
        text: {type: string}
        tool_calls:
          type: array
          items: {$ref: "#/components/schemas/ToolCall"}
        tool_results:
          type: array
          items: {$ref: "#/components/schemas/ToolResult"}
        provider:
          allOf: [{$ref: "#/components/schemas/ProviderPart"}]
          x-omitzero: true
        usage:
          description: The tokens of the model call that wrote a reply.
          allOf: [{$ref: "#/components/schemas/Usage"}]
          x-omitzero: true
        created_at: {type: string, format: date-time}

    ApprovalRequest:
      description: |
        A call that policy marked as requiring approval. Secrets are already
        redacted from it.
      type: object
      required: [id, run_id, harness, tool, args, reasons, created_at, expires_at]
      properties:
        id:
          description: Identifies the request when answering it.
          type: string
        run_id: {type: string}
        harness: {type: string}
        tool: {type: string}
        args: {$ref: "#/components/schemas/JSON"}
        reasons:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        expires_at:
          description: When the request is rejected if no one answers it.
          type: string
          format: date-time

    Answer:
      type: object
      additionalProperties: false
      required: [approved]
      properties:
        approved: {type: boolean}
        reason: {type: string}

    JSON:
      description: Any JSON value, kept as written.
      x-go-type: json.RawMessage
