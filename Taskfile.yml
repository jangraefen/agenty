# Development tasks, run with Task (https://taskfile.dev): "task --list".
version: "3"

# Credentials such as ANTHROPIC_API_KEY come from the environment or a
# git-ignored .env at the module root.
dotenv: [".env"]

vars:
  # The database of compose.yaml. Set DATABASE_URL to use another one.
  LOCAL_DATABASE_URL: postgres://agenty:{{.POSTGRES_PASSWORD | default "agenty-dev-password"}}@127.0.0.1:{{.POSTGRES_PORT | default "5432"}}/agenty
  DATABASE_URL: "{{.DATABASE_URL | default .LOCAL_DATABASE_URL}}"
  GOLANGCI_LINT_VERSION: v2.14.0
  SERVER: http://127.0.0.1:8080
  # The notes example's demo user signs in with this token, on the server and
  # in the client. The default is for local use only: the server listens on
  # localhost. Set AGENTY_TOKEN to use another one.
  AGENTY_TOKEN: '{{.AGENTY_TOKEN | default "agenty-local-demo-token-not-a-secret"}}'

tasks:
  db:
    desc: Start the local PostgreSQL database and wait until it is ready
    cmds:
      - docker compose up --detach --wait

  db:stop:
    desc: Stop the local database, keeping its data
    cmds:
      - docker compose down

  db:reset:
    desc: Stop the local database and delete its data
    cmds:
      - docker compose down --volumes

  generate:
    desc: Generate code after changing a query, a migration or the API's spec
    cmds:
      - go generate ./internal/store/ ./internal/api/ ./internal/server/
      - task: web:generate

  lint:
    desc: Run golangci-lint, at the version CI uses
    vars:
      GO_VERSION:
        sh: go env GOVERSION
    env:
      # Build golangci-lint with this module's Go, not the older one its own
      # module asks for: it cannot lint code newer than itself.
      GOTOOLCHAIN: "{{.GO_VERSION}}"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...

  test:
    desc: Run the tests with the race detector against the local database; pass Go test flags after --
    deps: [db]
    env:
      AGENTY_TEST_DATABASE_URL: "{{.DATABASE_URL}}"
    cmds:
      - go test -race {{.CLI_ARGS | default "./..."}}

  coverage:
    desc: Check that the tool gateway, policy and secret redaction are fully covered by their tests
    cmds:
      - scripts/coverage.sh

  check:
    desc: "What CI checks: generated code, lint, go mod tidy, the tests and their coverage, of the backend and the web frontend"
    cmds:
      - task: generate
      - test -z "$(git status --porcelain internal/store/db internal/api internal/server)"
      - git diff --exit-code web/src/api
      - test -z "$(git ls-files --others --exclude-standard web/src/api)"
      - task: lint
      - go mod tidy
      - git diff --exit-code go.mod go.sum
      - task: test
      - task: coverage
      - task: web:check

  build:
    desc: Build the agenty binary
    sources: ["**/*.go", "go.mod", "go.sum", "internal/store/migrations/*.sql"]
    generates: [agenty]
    cmds:
      - go build -o agenty ./cmd/agenty

  serve:
    desc: Serve the API for the notes example on the local database (needs ANTHROPIC_API_KEY and Node.js)
    deps: [build, db]
    dir: examples/notes
    env:
      DATABASE_URL: "{{.DATABASE_URL}}"
      AGENTY_TOKEN: "{{.AGENTY_TOKEN}}"
    cmds:
      - ../../agenty serve

  demo:
    desc: Apply the notes harness and run it on the running server; pass the input after --
    deps: [build]
    dir: examples/notes
    env:
      AGENTY_TOKEN: "{{.AGENTY_TOKEN}}"
      AGENTY_WORKSPACE: notes
    cmds:
      - ../../agenty apply --server {{.SERVER}} notes.yaml
      - ../../agenty run --server {{.SERVER}} notes {{.CLI_ARGS | default "tidy my notes" | shellQuote}}

  # The web frontend, in web/. Needs Node.js and pnpm.

  web:install:
    desc: Install the web frontend's dependencies from its lockfile
    dir: web
    cmds:
      - pnpm install --frozen-lockfile

  web:generate:
    desc: Generate the web frontend's API types from the OpenAPI spec
    deps: [web:install]
    dir: web
    cmds:
      - pnpm generate

  web:dev:
    desc: Serve the web frontend at http://127.0.0.1:5173
    deps: [web:install]
    dir: web
    cmds:
      - pnpm dev

  web:lint:
    desc: Lint and typecheck the web frontend
    deps: [web:install]
    dir: web
    cmds:
      - pnpm lint
      - pnpm typecheck

  web:test:
    desc: Run the web frontend's unit tests
    deps: [web:install]
    dir: web
    cmds:
      - pnpm test

  web:build:
    desc: Build the web frontend into web/dist
    deps: [web:install]
    dir: web
    cmds:
      - pnpm build

  web:e2e:
    desc: Run the web frontend's smoke test against a real agenty server (needs Google Chrome)
    deps: [build, db, web:install]
    vars:
      # A database of its own on the compose server, made afresh each time:
      # a starting server fails every running run in its database, which
      # must not be those of the development server.
      E2E_DATABASE_URL: postgres://agenty:{{.POSTGRES_PASSWORD | default "agenty-dev-password"}}@127.0.0.1:{{.POSTGRES_PORT | default "5432"}}/agenty_e2e
    env:
      AGENTY_E2E_DATABASE_URL: "{{.E2E_DATABASE_URL}}"
    cmds:
      - docker compose exec -T postgres dropdb --username agenty --if-exists agenty_e2e
      - docker compose exec -T postgres createdb --username agenty agenty_e2e
      - cd web && pnpm e2e

  web:check:
    desc: "What CI checks of the web frontend: lint, types, tests, the build and its generated route tree"
    cmds:
      - task: web:lint
      - task: web:test
      - task: web:build
      - git diff --exit-code web/src/routeTree.gen.ts
