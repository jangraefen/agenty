# sqlc configuration (ARCHITECTURE §11.1); run `task generate`, never edit dbgen/ by hand.
# The schema is the goose migrations; sqlc ignores their Down sections.
# Output files are named *.gen.go (ARCHITECTURE §4) so check:generated can detect orphans.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: dbgen
        out: dbgen
        sql_package: pgx/v5
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
