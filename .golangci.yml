version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - depguard # import boundaries, below
    - errorlint # wrapped errors are compared with errors.Is/As
    - forbidigo # trust-model rules, below
    - gosec # security-sensitive patterns
    - misspell
    - nolintlint # every //nolint names its linter and says why
    - testifylint # testify usage, e.g. require vs assert
    - unconvert
  settings:
    errcheck:
      # Errors assigned to _ count as unchecked: surface them, or panic if they
      # cannot happen.
      check-blank: true
    depguard:
      rules:
        opa:
          # OPA stays behind internal/policy: one place evaluates Rego.
          files: ["$all", "!**/internal/policy/**"]
          deny:
            - pkg: github.com/open-policy-agent/opa
              desc: evaluate policy only through internal/policy
        mcp:
          # Only internal/mcptool talks to MCP servers; a session elsewhere could
          # call tools around the gateway (trust model guarantee 2).
          files: ["$all", "!**/internal/mcptool/**"]
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: reach MCP servers only through internal/mcptool and the tool gateway
    forbidigo:
      analyze-types: true
      forbid:
        # Trust model guarantee 2: every side effect goes through the gateway.
        # Only internal/toolgateway may execute a tool.
        - pattern: ^toolgateway\.Tool\.Call$
          msg: execute tools only through the tool gateway (trust model guarantee 2)
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests of secret handling need fake credentials; G101 still guards
      # production code.
      - path: _test\.go$
        linters: [gosec]
        text: G101
      - path: internal/toolgateway/[^/]+\.go$
        linters: [forbidigo]
        text: execute tools only through the tool gateway

issues:
  # Show every finding; the defaults hide repeats and all but one per line.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jangraefen/agenty
