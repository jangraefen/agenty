provider:
  anthropic:
    api_key: {env: ANTHROPIC_API_KEY}
    max_tokens: 4096
    base_url: http://localhost:8080
database:
  url: {env: DATABASE_URL}
mcp_servers:
  tickets:
    command: tickets-mcp
    args: [--stdio]
    env:
      TICKETS_TOKEN: {env: TICKETS_TOKEN}
      LOG_LEVEL: {value: info}
policy:
  files: [policies/central.rego]
users:
  alice:
    token: {env: ALICE_TOKEN}
  bob:
    token: {env: BOB_TOKEN}
workspaces:
  notes:
    members: [alice, bob]
  ops:
    members: [bob]
approvals:
  timeout: 15m
cors:
  origins: ["http://localhost:5173"]
