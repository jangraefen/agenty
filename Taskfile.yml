# All build, test, and check entry points (ARCHITECTURE §15.4).
# Tools are installed on the PATH by the developer; `task setup` verifies their versions.
version: "3"

vars:
  GO_MODULES: server sandbox
  GO_PACKAGES: ./server/... ./sandbox/...
  # Exact: lint results depend on the version.
  GOLANGCI_LINT_VERSION: 2.14.0
  # Exact: mutants and threshold handling depend on the version.
  GREMLINS_VERSION: 0.6.0
  # Minimum versions.
  TASK_MIN_VERSION: 3.54.0
  LEFTHOOK_MIN_VERSION: 2.1.16
  DOCKER_MIN_VERSION: 25.0.0
  NODE_MIN_VERSION: 24.15.0 # matches web/package.json engines
  PNPM_MIN_VERSION: 12.8.1 # matches web/package.json packageManager
  # Exact: detected licenses depend on the version.
  GO_LICENSES_VERSION: 2.0.1
  # Exact: generated code (and its version header) depends on the version.
  OAPI_CODEGEN_VERSION: 2.8.0
  SQLC_VERSION: 1.31.1
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Verify tool prerequisites and install the Lefthook git hooks
    cmds:
      - task: setup:verify
      - lefthook install

  setup:verify:
    internal: true
    silent: true
    cmds:
      - |
        set +e # report every tool, then fail once
        failed=0
        report() { # name, installed version, ok (0/1), requirement, install hint
          if [ "$3" = 0 ]; then echo "ok      $1 $2"; else echo "FAILED  $1 ${2:-missing}: need $4 - $5"; failed=1; fi
        }
        at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1)" = "$2" ]; }

        have=$(go env GOVERSION 2>/dev/null | sed 's/^go//')
        [ -n "$have" ]; report go "$have" $? "Go (toolchain from go.work is fetched automatically)" "https://go.dev/doc/install"

        have="{{.TASK_VERSION}}"; have=${have#v}
        at_least "$have" {{.TASK_MIN_VERSION}}; report task "$have" $? ">= {{.TASK_MIN_VERSION}}" "brew install go-task, or https://taskfile.dev/installation"

        have=$(lefthook version 2>/dev/null)
        [ -n "$have" ] && at_least "$have" {{.LEFTHOOK_MIN_VERSION}}; report lefthook "$have" $? ">= {{.LEFTHOOK_MIN_VERSION}}" "brew install lefthook, or https://lefthook.dev/installation"

        have=$(docker version --format '{{"{{"}}.Client.Version{{"}}"}}' 2>/dev/null)
        [ -n "$have" ] && at_least "$have" {{.DOCKER_MIN_VERSION}}; report docker "$have" $? ">= {{.DOCKER_MIN_VERSION}}" "brew install colima docker && colima start, or https://docs.docker.com/engine/install/"

        have=$(golangci-lint version --short 2>/dev/null)
        [ "$have" = {{.GOLANGCI_LINT_VERSION}} ]; report golangci-lint "$have" $? "exactly {{.GOLANGCI_LINT_VERSION}}" "https://golangci-lint.run/docs/welcome/install/"

        have=$(gremlins --version 2>/dev/null | awk '{print $3}')
        [ "$have" = {{.GREMLINS_VERSION}} ]; report gremlins "$have" $? "exactly {{.GREMLINS_VERSION}}" "brew tap go-gremlins/tap && brew install gremlins"

        have=$(node --version 2>/dev/null | sed 's/^v//')
        [ -n "$have" ] && at_least "$have" {{.NODE_MIN_VERSION}}; report node "$have" $? ">= {{.NODE_MIN_VERSION}}" "brew install node, or https://nodejs.org/en/download"

        have=$(pnpm --version 2>/dev/null)
        [ -n "$have" ] && at_least "$have" {{.PNPM_MIN_VERSION}}; report pnpm "$have" $? ">= {{.PNPM_MIN_VERSION}}" "brew install pnpm"

        have=$(go version -m "$(command -v go-licenses)" 2>/dev/null | awk '$1 == "mod" { sub(/^v/, "", $3); print $3 }')
        [ "$have" = {{.GO_LICENSES_VERSION}} ]; report go-licenses "$have" $? "exactly {{.GO_LICENSES_VERSION}}" "go install github.com/google/go-licenses/v2@v{{.GO_LICENSES_VERSION}}"

        have=$(oapi-codegen --version 2>/dev/null | sed -n 's/^v//p')
        [ "$have" = {{.OAPI_CODEGEN_VERSION}} ]; report oapi-codegen "$have" $? "exactly {{.OAPI_CODEGEN_VERSION}}" "go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v{{.OAPI_CODEGEN_VERSION}}"

        have=$(sqlc version 2>/dev/null | sed 's/^v//')
        [ "$have" = {{.SQLC_VERSION}} ]; report sqlc "$have" $? "exactly {{.SQLC_VERSION}}" "brew install sqlc"

        exit $failed

  build:
    desc: Build the web UI and the agenty and agenty-sandbox binaries into ./dist
    cmds:
      - task: build:web
      - go build -ldflags "-X github.com/jangraefen/agenty/server/internal/buildinfo.Version={{.VERSION}}" -o dist/agenty ./server/cmd/agenty
      - go build -ldflags "-X github.com/jangraefen/agenty/sandbox/internal/buildinfo.Version={{.VERSION}}" -o dist/agenty-sandbox ./sandbox/cmd/agenty-sandbox

  # Container images (deploy/<image>.Dockerfile, context: repository root), tagged <image>:<version>.
  build:images:
    desc: Build the agenty and agenty-sandbox container images locally, tagged and labeled with the version
    cmds:
      - for: [agenty, agenty-sandbox]
        cmd: docker build -f deploy/{{.ITEM}}.Dockerfile --build-arg VERSION={{.VERSION}} -t {{.ITEM}}:{{.VERSION}} .

  # Not part of `check`: an image rebuild takes about a minute (ARCHITECTURE §15.4).
  test:images:
    desc: Build the container images and smoke-test them (--version, version label, non-root user)
    silent: true
    cmds:
      - task: build:images
      - for: [agenty, agenty-sandbox]
        cmd: |
          image={{.ITEM}}:{{.VERSION}}
          got=$(docker run --rm "$image" --version) || { echo "FAILED  $image --version exited non-zero"; exit 1; }
          [ "$got" = "{{.ITEM}} {{.VERSION}}" ] || { echo "FAILED  $image --version printed '$got', want '{{.ITEM}} {{.VERSION}}'"; exit 1; }
          label=$(docker image inspect --format '{{"{{"}}index .Config.Labels "org.opencontainers.image.version"{{"}}"}}' "$image")
          [ "$label" = "{{.VERSION}}" ] || { echo "FAILED  $image version label is '$label', want '{{.VERSION}}'"; exit 1; }
          user=$(docker image inspect --format '{{"{{"}}.Config.User{{"}}"}}' "$image")
          case "${user%%:*}" in ""|0|root) echo "FAILED  $image runs as root (USER '$user')"; exit 1;; esac
          echo "ok      $image: $got, label $label, user $user"

  lint:
    desc: Lint all Go modules and web/ (lint:go, then lint:web)
    cmds:
      - task: lint:go
      - task: lint:web

  lint:go:
    desc: Lint all Go modules (go mod tidy, golangci-lint with architecture rules via depguard)
    cmds:
      - for: { var: GO_MODULES }
        cmd: cd {{.ITEM}} && go mod tidy -diff && golangci-lint run ./...

  # Web (web/): packages pinned by pnpm-lock.yaml and installed with pnpm (never npm); tools run from node_modules.
  web:deps:
    internal: true
    dir: web
    sources: [package.json, codegen/package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
    generates: [node_modules/.modules.yaml]
    cmds:
      - pnpm install --frozen-lockfile

  lint:web:
    desc: Lint and format-check (Biome) and type-check (tsc) the web UI
    deps: [web:deps]
    dir: web
    cmds:
      - pnpm run --silent lint
      - pnpm run --silent typecheck

  build:web:
    desc: Build the web UI into web/dist with Vite
    deps: [web:deps]
    dir: web
    cmds:
      - pnpm run --silent build

  # Code generation (ARCHITECTURE §4). Every generate:* sub-task reads its inputs below SRC_ROOT and writes
  # each output below GEN_ROOT at its repository-relative path; both default to the repository root and must
  # be absolute. check:generated relies on this to regenerate into a temporary directory and compare.
  # Generated code is committed and never edited by hand; one generate:<kind> sub-task per generator.
  generate:
    desc: Regenerate all generated code from its sources
    cmds:
      - task: generate:api
      - task: generate:sql

  generate:api:
    desc: Generate the Gin server interfaces (oapi-codegen) and the TypeScript API types (openapi-typescript) from api/openapi.yaml
    deps: [web:deps]
    vars:
      SRC: "{{.SRC_ROOT | default .ROOT_DIR}}"
      OUT: "{{.GEN_ROOT | default .ROOT_DIR}}"
    cmds:
      - mkdir -p "{{.OUT}}/server/internal/httpapi" "{{.OUT}}/web/src/api"
      - oapi-codegen -config "{{.SRC}}/api/oapi-codegen.yaml" -o "{{.OUT}}/server/internal/httpapi/openapi.gen.go" "{{.SRC}}/api/openapi.yaml"
      # openapi-typescript runs from web/codegen, which has the TypeScript 5 it needs (ARCHITECTURE §15.4).
      - cd web/codegen && pnpm exec openapi-typescript "{{.SRC}}/api/openapi.yaml" -o "{{.OUT}}/web/src/api/schema.gen.ts" --silent

  generate:sql:
    desc: Generate the Go database queries (sqlc) from server/internal/database/{migrations,queries} into server/internal/database/dbgen
    silent: true
    vars:
      SRC: "{{.SRC_ROOT | default .ROOT_DIR}}"
      OUT: "{{.GEN_ROOT | default .ROOT_DIR}}"
    cmds:
      # sqlc writes next to its configuration, so it runs on a copy of the inputs; only the generated
      # *.gen.go files are copied out (dbgen/ also holds hand-written tests).
      - |
        work=$(mktemp -d) && trap 'rm -rf "$work"' EXIT || exit 1
        db=server/internal/database
        mkdir -p "$work/$db" "{{.OUT}}/$db/dbgen" || exit 1
        cp -R "{{.SRC}}/$db/sqlc.yaml" "{{.SRC}}/$db/migrations" "{{.SRC}}/$db/queries" "$work/$db/" || exit 1
        sqlc generate -f "$work/$db/sqlc.yaml" || exit 1
        cp "$work/$db/dbgen/"*.gen.go "{{.OUT}}/$db/dbgen/"

  check:generated:
    desc: Fail if generated code differs from what task generate produces now (the tree is not modified)
    silent: true
    vars:
      # The tree to check; test:gates:generated points it at a modified copy.
      TREE: "{{.TREE | default .ROOT_DIR}}"
    cmds:
      - |
        out=$(mktemp -d) && trap 'rm -rf "$out"' EXIT || exit 1
        task -d "{{.ROOT_DIR}}" --silent generate SRC_ROOT="{{.TREE}}" GEN_ROOT="$out" >/dev/null || { echo "FAILED  generated code: task generate failed"; exit 1; }
        failed=""
        for file in $(cd "$out" && find . -type f | sed 's|^\./||' | sort); do
          diff -u "{{.TREE}}/$file" "$out/$file" >&2 || failed="$failed $file"
        done
        # Generated files are named *.gen.* (ARCHITECTURE §4). Any such file in the tree that the generators
        # no longer write (renamed output, removed generator) is an orphan; git-ignored tool and build
        # directories are skipped.
        orphans=$(cd "{{.TREE}}" && find . \( -name .git -o -name .claude -o -name node_modules -o -name dist \
            -o -name coverage -o -name .task \) -prune -o -type f -name '*.gen.*' -print | sed 's|^\./||' | sort \
          | while read -r file; do [ -f "$out/$file" ] || printf ' %s' "$file"; done)
        [ -z "$failed" ] || echo "FAILED  generated code is out of date:$failed - run task generate and commit the result" >&2
        [ -z "$orphans" ] || echo "FAILED  generated files not produced by task generate:$orphans - delete them or restore their generator" >&2
        [ -z "$failed$orphans" ] || exit 1
        echo "ok      generated code is up to date"

  check:
    desc: Run all gating targets in order; stops at the first failure
    cmds:
      - task: lint
      - task: check:generated
      - task: build:web
      - task: check:licenses
      - task: test:gates
      - task: test:unit
      - task: test:module
      - task: check:coverage
      - task: test:integration
      - task: test:e2e
      - task: test:ui
      - task: test:mutation
      - task: test:milestones

  check:licenses:
    desc: Check dependency licenses against the allowlist (ARCHITECTURE §16)
    cmds:
      - task: check:licenses:go
      - task: check:licenses:web

  check:licenses:go:
    desc: Check Go dependency licenses (shipped and all, including transitive) against go-licenses-allowlist.txt
    cmds:
      - for: { var: GO_MODULES }
        task: check:licenses:go:module
        vars: { MODULE: "{{.ITEM}}" }

  # Checks one Go module directory: packages linked into its binaries (./cmd/...) against the "shipped"
  # licenses, and all its packages including test-only imports against "shipped" plus "dev". go-licenses
  # resolves build-constrained files for one platform, so each scope runs for linux/amd64 and linux/arm64
  # (the container image platforms) and, if different, the host platform.
  check:licenses:go:module:
    internal: true
    silent: true
    dir: "{{.MODULE}}"
    vars:
      ALLOWLIST: '{{.ALLOWLIST | default (print .ROOT_DIR "/go-licenses-allowlist.txt")}}'
    cmds:
      - |
        [ -f "{{.ALLOWLIST}}" ] || { echo "missing allowlist {{.ALLOWLIST}}" >&2; exit 1; }
        list() { awk -v scopes="$1" '
          /^[[:space:]]*(#|$)/ { next }
          NF != 2 || ($1 != "shipped" && $1 != "dev") { print "invalid allowlist line: " $0 > "/dev/stderr"; exit 1 }
          index(scopes, $1) { printf "%s%s", sep, $2; sep = "," }' "{{.ALLOWLIST}}"; }
        shipped=$(list shipped) || exit 1
        all=$(list "shipped dev") || exit 1
        # An empty --allowed_licenses would make go-licenses ignore the allowlist.
        [ -n "$shipped" ] || { echo "invalid allowlist {{.ALLOWLIST}}: no shipped licenses" >&2; exit 1; }
        host=$(go env GOOS)/$(go env GOARCH)
        platforms="linux/amd64 linux/arm64"
        case " $platforms " in *" $host "*) ;; *) platforms="$platforms $host" ;; esac
        check() { # platform, scope, allowed licenses, go-licenses arguments
          platform=$1; scope=$2; allowed=$3; shift 3
          # Our own modules are not licensed yet (VISION §13); their dependencies are still checked.
          # --ignore matches by string prefix, so the trailing slash keeps it from also matching other
          # modules such as github.com/jangraefen/agenty-sdk or github.com/jangraefen/agenty/server-x. A package
          # at a module root (none exists) would not be ignored and would fail the check.
          # The test-tier build tags (those of go-tier) make --include_tests also see imports of tagged test
          # files; they are added to any GOFLAGS already set.
          if out=$(GOOS=${platform%/*} GOARCH=${platform#*/} GOFLAGS="${GOFLAGS:+$GOFLAGS }-tags=module,integration,e2e,milestone" go-licenses check \
              --ignore github.com/jangraefen/agenty/server/ --ignore github.com/jangraefen/agenty/sandbox/ \
              --allowed_licenses="$allowed" "$@" 2>&1); then
            echo "ok      licenses go {{.MODULE}} $scope $platform"
          else
            echo "FAILED  licenses go {{.MODULE}} $scope $platform: not in the allowlist ($allowed)" >&2
            # Drop go-licenses' warnings about assembly files, which it cannot inspect.
            printf '%s\n' "$out" | grep -v -e '^W[0-9]' -e '^/' >&2
            return 1
          fi
        }
        for platform in $platforms; do
          check $platform shipped "$shipped" ./cmd/... || failed=1
          check $platform all "$all" --include_tests ./... || failed=1
        done
        exit ${failed:-0}

  check:licenses:web:
    desc: Check web dependency licenses (shipped and all) against the allowlists in web/scripts/check-licenses.mjs
    deps: [web:deps]
    dir: web
    cmds:
      - pnpm run --silent licenses

  test:unit:
    desc: Run unit tests (test:unit:go, then test:unit:web)
    cmds:
      - task: test:unit:go
      - task: test:unit:web

  test:unit:go:
    desc: Run the Go unit tests, writing coverage/unit.out for check:coverage
    cmds:
      # Remove the previous profile first so a failed run never leaves a stale one for check:coverage.
      - mkdir -p coverage && rm -f coverage/unit.out
      - go test -count=1 -coverprofile=coverage/unit.out {{.GO_PACKAGES}}

  test:unit:web:
    desc: Run the web UI unit and component tests (Vitest)
    deps: [web:deps]
    dir: web
    cmds:
      - pnpm run --silent test

  test:module:
    desc: Run module tests (build tag "module")
    cmds:
      - task: go-tier
        vars: { TIER: module, COVER: "true" }

  check:coverage:
    desc: Check per-package statement coverage against .covergate.yaml (ARCHITECTURE §15.3); consumes coverage/unit.out and coverage/module.out written by test:unit and test:module, so run those first
    preconditions:
      - sh: test -f coverage/unit.out
        msg: "coverage/unit.out is missing: run task test:unit first"
      - sh: test -f coverage/module.out
        msg: "coverage/module.out is missing: run task test:module first"
    cmds:
      - go run ./server/internal/testinfra/covergate -config .covergate.yaml coverage/unit.out coverage/module.out

  test:integration:
    desc: Run integration tests against the Docker Compose stack (build tag "integration")
    cmds:
      - task: go-tier
        vars: { TIER: integration }

  test:e2e:
    desc: Run end-to-end scenarios (build tag "e2e")
    cmds:
      - task: go-tier
        vars: { TIER: e2e }

  test:ui:
    desc: Run web component and browser tests
    cmds:
      - echo "test:ui - no tests yet"

  # Mutation testing (ARCHITECTURE §15.3): Gremlins mutates each package in MUTATION_PACKAGES with the
  # settings in .gremlins.yaml (efficacy threshold 80 %), and the task fails naming every package below it.
  # Override the list for one run with `task test:mutation MUTATION_PACKAGES="server/internal/<pkg>"`.
  test:mutation:
    desc: Run mutation tests (Gremlins) on the critical packages
    silent: true
    vars:
      # Critical packages (toolgateway, policy, credentials, identity, runs) as repository-relative
      # paths, space-separated; empty until they exist.
      MUTATION_PACKAGES: '{{.MUTATION_PACKAGES | default ""}}'
    cmds:
      - |
        set -u
        pkgs="{{.MUTATION_PACKAGES}}"
        if [ -z "$pkgs" ]; then
          echo "test:mutation - no packages configured (MUTATION_PACKAGES in Taskfile.yml)"
          exit 0
        fi
        config="$PWD/.gremlins.yaml"
        failed=""
        for pkg in $pkgs; do
          echo "test:mutation - $pkg"
          # Run from the package's own module; GOWORK=off keeps go.work.sum untouched (no cross-module imports).
          dir=$(cd "$pkg" && pwd -P) && module=$(cd "$dir" && dirname "$(GOWORK=off go env GOMOD)") \
            && (cd "$module" && GOWORK=off gremlins unleash --config "$config" ".${dir#"$module"}") \
            || failed="$failed $pkg"
        done
        if [ -n "$failed" ]; then
          echo "test:mutation - FAILED (efficacy below threshold or error):$failed"
          exit 1
        fi

  test:gates:
    desc: Prove that every quality gate fails when its rule is violated
    cmds:
      - task: test:gates:generated

  # Runs check:generated against a temporary copy of the contract and the generated files: the unchanged
  # copy must pass, and every kind of drift must fail.
  test:gates:generated:
    internal: true
    silent: true
    cmds:
      - |
        tmp=$(mktemp -d) && trap 'rm -rf "$tmp"' EXIT || exit 1
        db=server/internal/database
        files="api/openapi.yaml api/oapi-codegen.yaml server/internal/httpapi/openapi.gen.go web/src/api/schema.gen.ts
          $db/sqlc.yaml $db/migrations/*.sql $db/queries/*.sql $db/dbgen/*.gen.go"
        reset() {
          rm -rf "$tmp/tree"
          for file in $files; do mkdir -p "$tmp/tree/$(dirname "$file")" && cp "$file" "$tmp/tree/$file" || exit 1; done
        }
        failed=0
        expect() { # pass|fail, description
          if task -d "{{.ROOT_DIR}}" --silent check:generated TREE="$tmp/tree" >"$tmp/log" 2>&1; then got=pass; else got=fail; fi
          if [ "$got" = "$1" ]; then
            echo "ok      gate generated code: $2"
          else
            echo "FAILED  gate generated code: $2 (check:generated: $got, want $1)"; cat "$tmp/log"; failed=1
          fi
        }
        reset; expect pass "up-to-date code passes"
        reset; printf '// edited\n' >>"$tmp/tree/server/internal/httpapi/openapi.gen.go"; expect fail "edited Go code fails"
        reset; printf '// edited\n' >>"$tmp/tree/web/src/api/schema.gen.ts"; expect fail "edited TypeScript code fails"
        reset; rm "$tmp/tree/web/src/api/schema.gen.ts"; expect fail "missing generated file fails"
        reset; cp "$tmp/tree/web/src/api/schema.gen.ts" "$tmp/tree/web/src/api/old-schema.gen.ts"; expect fail "orphaned generated file (renamed output) fails"
        reset; mkdir -p "$tmp/tree/server/internal/removed" && printf "package removed\n" >"$tmp/tree/server/internal/removed/removed.gen.go"; expect fail "orphaned generated file (removed generator) fails"
        reset; sed 's/operationId: getReadyz/operationId: getReadiness/' api/openapi.yaml >"$tmp/tree/api/openapi.yaml"
        cmp -s api/openapi.yaml "$tmp/tree/api/openapi.yaml" && { echo "FAILED  gate generated code: contract edit had no effect"; exit 1; }
        expect fail "contract changed without regenerating fails"
        reset; printf '// edited\n' >>"$tmp/tree/$db/dbgen/db.gen.go"; expect fail "edited sqlc code fails"
        reset; rm "$tmp/tree/$db/dbgen/models.gen.go"; expect fail "missing sqlc file fails"
        reset; printf '%s\n' '-- name: PingAgain :one' 'SELECT 1::int AS ok;' >>"$tmp/tree/$db/queries/health.sql"
        expect fail "SQL query changed without regenerating fails"
        exit $failed

  test:milestones:
    desc: Run all automated milestone demos (build tag "milestone")
    cmds:
      - task: go-tier
        vars: { TIER: milestone }

  test:milestone:*:
    desc: Run one automated milestone demo, e.g. task test:milestone:M1
    vars:
      MILESTONE: "{{index .MATCH 0}}"
    cmds:
      - task: go-tier
        vars: { TIER: milestone, RUN: "TestMilestone{{.MILESTONE}}", MILESTONE: "{{.MILESTONE}}" }

  test:nightly:
    desc: Run quality checks against a real model (not gating)
    cmds:
      - echo "test:nightly - no tests yet"

  go-tier:
    internal: true
    vars:
      RUN: '{{.RUN | default ""}}'
      PATTERN: '{{if .RUN}}^func {{.RUN}}\b{{else}}^//go:build .*\b{{.TIER}}\b{{end}}'
    cmds:
      - |
        {{if .COVER}}mkdir -p coverage && rm -f coverage/{{.TIER}}.out{{end}}
        if grep -rqE --include='*_test.go' '{{.PATTERN}}' {{.GO_MODULES}}; then
          # testcontainers-go ignores Docker contexts; on macOS (Colima, Lima, Docker Desktop) point it at the
          # active context's socket and tell it the socket path inside the VM.
          if [ "$(uname)" = Darwin ]; then
            export DOCKER_HOST="${DOCKER_HOST:-$(docker context inspect --format '{{"{{"}}.Endpoints.docker.Host{{"}}"}}' 2>/dev/null)}"
            export TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE="${TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE:-/var/run/docker.sock}"
          fi
          go test -count=1 -tags {{.TIER}} {{if .COVER}}-coverprofile=coverage/{{.TIER}}.out {{end}}{{if .RUN}}-run '^{{.RUN}}$'{{end}} {{.GO_PACKAGES}}
        else
          echo "{{if .RUN}}test:milestone:{{.MILESTONE}}{{else}}test:{{.TIER}}{{end}} - no tests yet"
        fi
