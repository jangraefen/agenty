name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      AGENTY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: generated code is up to date (sqlc queries, OpenAPI types and server)
        run: |
          go generate ./internal/store/ ./internal/api/ ./internal/server/
          git status --porcelain internal/store/db internal/api internal/server
          test -z "$(git status --porcelain internal/store/db internal/api internal/server)"

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      # IDEA.md: the gateway, policy and secret redaction are where security
      # lives and get full coverage.
      - name: toolgateway, policy and secret coverage is 100%
        run: |
          for pkg in toolgateway policy secret; do
            go test -coverprofile="$pkg.out" "./internal/$pkg/"
            total=$(go tool cover -func="$pkg.out" | awk '/^total:/ {print $3}')
            echo "$pkg coverage: $total"
            [ "$total" = "100.0%" ] || exit 1
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: generated API types are up to date
        run: |
          pnpm generate
          git diff --exit-code src/api
          test -z "$(git ls-files --others --exclude-standard src/api)"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: build, and the generated route tree is up to date
        run: |
          pnpm build
          git diff --exit-code src/routeTree.gen.ts
