# Local development stack (ARCHITECTURE §14).
#   docker compose -f deploy/compose.yaml up -d
#   DSN: postgres://agenty:agenty-dev-password@localhost:5432/agenty?sslmode=disable
# Development credentials only; never use them outside a local machine.
# The image ships pgvector; the extension is created per database (migrations, or pgtest.NewDatabase in tests).
name: agenty

services:
  postgres:
    # Same image as the test helper (server/internal/testinfra/pgtest); a unit test keeps them in sync.
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: agenty
      POSTGRES_PASSWORD: agenty-dev-password
      POSTGRES_DB: agenty
    ports:
      - "127.0.0.1:${AGENTY_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep their data in a versioned directory below this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: the temporary server during first-time init listens only on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agenty -d agenty"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
